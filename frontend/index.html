<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - MatchAnalytics </title>
    <script src="js/tailwind.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 font-sans text-gray-800 relative">

    <header class="flex justify-between items-center p-4 bg-white shadow-sm border-b">
        <div class="flex items-center gap-2">
            <div class="w-6 h-6 bg-blue-600 rounded"></div>
            <h1 class="text-xl font-bold text-gray-800">MatchAnalytics </h1>
        </div>
    </header>

    <main class="max-w-5xl mx-auto mt-10 p-6 animate-slide-up">
        <h2 class="text-2xl font-bold text-gray-800 mb-6"> Resume Scanner & Ranking System</h2>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
            <h3 class="font-semibold text-lg text-gray-700 mb-4 border-b pb-2">Resume Scanner</h3>
            
            <form id="uploadForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Upload Resumes <span class="text-gray-400 font-normal">(PDF, DOCX, IMG)</span></label>
                    <div id="dropZone" class="border-2 border-dashed border-gray-300 rounded-lg p-6 flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50 transition-all duration-300 text-center min-h-[120px]">
                        <span class="text-3xl mb-2">📁</span>
                        <span class="bg-blue-100 text-blue-700 px-3 py-1 rounded-full text-xs font-semibold mb-2">Click or Drag Files Here</span>
                        <span class="text-gray-500 text-sm font-medium" id="fileCount">No files selected</span>
                        <input type="file" id="resumeFiles" accept=".pdf,.docx,.png,.jpg,.jpeg" multiple class="hidden">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Paste Job Description</label>
                    <textarea id="jobDescription" rows="5" class="w-full border border-gray-300 rounded-lg p-3 text-sm focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200 transition-all shadow-sm" placeholder="Paste the job description here..."></textarea>
                </div>

                <div class="md:col-span-2 flex justify-center mt-2">
                    <button type="button" id="analyzeBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-10 py-3 rounded-lg font-medium shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all w-full md:w-auto flex items-center gap-2">
                        <span>🚀</span> Analyze Candidates
                    </button>
                </div>
            </form>
        </div>
    </main>

    <div id="loadingOverlay" class="fixed inset-0 bg-white/90 backdrop-blur-sm hidden flex-col items-center justify-center z-50 transition-opacity">
        <div class="loader mb-4"></div>
        <h2 id="loadingText" class="text-2xl font-bold text-gray-800">Scanning Candidate Profiles...</h2>
        <p class="text-gray-500 mt-2">Extracting skills and matching with job description.</p>
    </div>

    <script src="js/upload.js"></script>
    <script src="js/analyze.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const jdTextarea = document.getElementById('jobDescription');
            const analyzeBtn = document.getElementById('analyzeBtn');

            // 1. Agar user Dashboard se 'Edit JD' daba kar wapas aaya hai
            if (localStorage.getItem('editMode') === 'true') {
                const savedJD = localStorage.getItem('lastSavedJD');
                if (savedJD && jdTextarea) {
                    jdTextarea.value = savedJD; // Purani JD auto-fill kar di
                }
                localStorage.removeItem('editMode'); // Normal mode wapas on kar diya
            }

            // 2. Jaise hi user Analyze button dabaye, current JD ko save kar lo
            if (analyzeBtn && jdTextarea) {
                analyzeBtn.addEventListener('click', () => {
                    localStorage.setItem('lastSavedJD', jdTextarea.value);
                });
            }
        });
    </script>
</body>
</html>
